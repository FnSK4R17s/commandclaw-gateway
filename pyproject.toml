[project]
name = "commandclaw-gateway"
version = "1.0.0"
description = "LLM gateway for the CommandClaw ecosystem"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "redis>=5.0",
    "tiktoken>=0.7",
    "prometheus-client>=0.20",
    "langfuse>=3.0",
    "pyyaml>=6.0",
    "cryptography>=42.0",
    "boto3>=1.34",
    "google-auth>=2.30",
    "python-ulid>=3.0",
    "sse-starlette>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "fakeredis>=2.25",
    "httpx",  # for TestClient
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120
