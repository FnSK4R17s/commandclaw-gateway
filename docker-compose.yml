services:
  gateway:
    build: .
    ports:
      - "4000:4000"
    environment:
      - CONFIG_PATH=/app/config.yaml
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - .env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./pricing.yaml:/app/pricing.yaml:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
